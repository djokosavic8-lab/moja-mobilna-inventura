<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura 2026</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#007bff">
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; overflow-x: auto; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 8px; cursor: pointer; }
        button:disabled { background: #999; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        button.share { background: #0078d4; margin-top: 12px; }
        button.edit { background: #ffc107; color: #000; padding: 6px 10px; font-size: 14px; width: auto; margin-top: 0; }
        button.del-row { background: #dc3545; color: #fff; padding: 6px 10px; font-size: 14px; width: auto; margin-top: 0; margin-left: 4px; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        video { width: 100%; max-height: 260px; background: #000; border-radius: 8px; margin-top: 10px; display: none; object-fit: cover; }
        #status { padding: 10px; margin-top: 10px; border-radius: 5px; font-size: 14px; display: none; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <h2>📦 Mobilna artikl GIOCO 2026</h2>

    <div class="box">
        <h3>1. Skeniranje / Unos</h3>
        <div id="status"></div>
        <video id="video" playsinline autoplay muted></video>
        <button id="btnKamera" type="button">📷 Upali kameru za Bar-kod</button>
        
        <p><label>Bar-kod ili Šifra:</label><input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno"></p>
        <p><label>Naziv robe:</label><input type="text" id="naziv" placeholder="Unesite naziv artikla"></p>
        <p><label>Količina:</label><input type="number" id="kolicina" value="1" min="1"></p>
        <p><label>Cijena:</label><input type="number" id="cijena" step="0.01" placeholder="0.00"></p>
        <button id="btnDodaj" type="button">➕ Upiši Artikal</button>
    </div>

    <div class="box">
        <h3>2. Zadržani artikli na telefonu (<span id="ukupnoStavki">0</span>)</h3>
        <button class="share" id="btnPodijeli" type="button">☁️ Pošalji / Podijeli (inventura.txt)</button>
        <button class="download" id="btnPreuzmi" type="button">💾 Preuzmi lokalno na telefon (CSV)</button>
        <button class="delete" id="btnObrisi" type="button">🗑️ Obriši sve sa telefona</button>
        
        <table>
            <thead>
                <tr>
                    <th>Bar-kod</th>
                    <th>Naziv</th>
                    <th>Kol.</th>
                    <th>Cijena</th>
                    <th>Akcija</th>
                </tr>
            </thead>
            <tbody id="tabelaArtikala"></tbody>
        </table>
    </div>

<script>
    let artikli = JSON.parse(localStorage.getItem("inventura_artikli")) || [];
    let stream = null, aktivno = false, pauza = false;
    const video = document.getElementById("video");
    const btnKamera = document.getElementById("btnKamera");
    const statusDiv = document.getElementById("status");

    function poruka(t) { 
        statusDiv.style.display = "block"; 
        statusDiv.innerHTML = t; 
    }

    // Automatski popuni naziv i cijenu ako bar-kod već postoji u listi
    document.getElementById("sifra").addEventListener("input", function() {
        let s = this.value.trim();
        let postojeci = artikli.find(a => a.sifra === s);
        if (postojeci) {
            document.getElementById("naziv").value = postojeci.naziv || "";
            document.getElementById("cijena").value = postojeci.cijena || "";
        }
    });

    btnKamera.onclick = async function() {
        if (aktivno) { ugasiKameru(); return; }
        statusDiv.style.display = "none";

        if (!window.isSecureContext) {
            poruka("<b>BLOKIRANO:</b> Sajt mora biti otvoren preko <b>https://</b> adrese.");
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            poruka("<b>GREŠKA:</b> Pregledač ne podržava pristup kameri. Koristite Google Chrome.");
            return;
        }

        btnKamera.disabled = true;
        btnKamera.innerText = "⏳ Palim kameru...";

        try {
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false
            });

            video.style.display = "block";
            video.srcObject = stream;
            await video.play();

            aktivno = true;
            btnKamera.disabled = false;
            btnKamera.innerText = "🛑 Ugasi kameru";
            btnKamera.style.background = "#6c757d";
            
            citajBarkod();

        } catch (err) {
            ugasiKameru();
            poruka("<b>GREŠKA KAMERE:</b> " + err.name + " - " + err.message);
        }
    };

    function ugasiKameru() {
        aktivno = false;
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        video.srcObject = null;
        video.style.display = "none";
        btnKamera.disabled = false;
        btnKamera.innerText = "📷 Upali kameru za Bar-kod";
        btnKamera.style.background = "#007bff";
    }

    function citajBarkod() {
        if (!("BarcodeDetector" in window)) {
            poruka("Kamera radi, ali ovaj pregledač/telefon nema ugrađen čitač bar-kodova.");
            return;
        }
        const detector = new BarcodeDetector();
        async function petlja() {
            if (!aktivno) return;
            if (!pauza && video.readyState >= 2) {
                try {
                    const kodovi = await detector.detect(video);
                    if (kodovi.length > 0) {
                        pauza = true;
                        let skenirano = kodovi[0].rawValue;
                        document.getElementById("sifra").value = skenirano;
                        if (navigator.vibrate) navigator.vibrate(100);

                        let postojeci = artikli.find(a => a.sifra === skenirano);
                        if (postojeci) {
                            document.getElementById("naziv").value = postojeci.naziv || "";
                            document.getElementById("cijena").value = postojeci.cijena || "";
                            dodajArtikal();
                        } else {
                            document.getElementById("naziv").focus();
                        }
                        
                        setTimeout(() => { pauza = false; }, 1500);
                    }
                } catch (e) {}
            }
            requestAnimationFrame(petlja);
        }
        petlja();
    }

    function dodajArtikal() {
        let sifra = document.getElementById("sifra").value.trim();
        let naziv = document.getElementById("naziv").value.trim();
        let kol = parseInt(document.getElementById("kolicina").value);
        let cijena = parseFloat(document.getElementById("cijena").value) || 0;

        if (!sifra || isNaN(kol) || kol < 1) {
            alert("Unesite validan bar-kod/šifru i količinu!");
            return;
        }

        let p = artikli.find(a => a.sifra === sifra);
        if (p) {
            p.kolicina += kol;
            if (naziv) p.naziv = naziv;
            if (cijena > 0) p.cijena = cijena;
        } else {
            artikli.unshift({ sifra: sifra, naziv: naziv, kolicina: kol, cijena: cijena });
        }

        sacuvajIPrikazi();
        document.getElementById("sifra").value = "";
        document.getElementById("naziv").value = "";
        document.getElementById("kolicina").value = "1";
        document.getElementById("cijena").value = "";
    }

    document.getElementById("btnDodaj").onclick = dodajArtikal;

    function sacuvajIPrikazi() {
        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        const tbody = document.getElementById("tabelaArtikala");
        tbody.innerHTML = "";
        document.getElementById("ukupnoStavki").innerText = artikli.length;

        artikli.forEach((a, i) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${a.sifra}</td>
                <td>${a.naziv || "-"}</td>
                <td><b>${a.kolicina}</b></td>
                <td>${Number(a.cijena || 0).toFixed(2)}</td>
                <td>
                    <button class="edit" onclick="izmijeniArtikal(${i})">✏️</button>
                    <button class="del-row" onclick="obrisiJedan(${i})">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.izmijeniArtikal = function(i) {
        let a = artikli[i];
        let noviNaziv = prompt("Naziv artikla:", a.naziv || "");
        if (noviNaziv === null) return;
        let novaKol = prompt("Količina:", a.kolicina);
        if (novaKol === null) return;
        let novaCijena = prompt("Cijena:", a.cijena || 0);
        if (novaCijena === null) return;

        a.naziv = noviNaziv.trim();
        a.kolicina = parseInt(novaKol) || a.kolicina;
        a.cijena = parseFloat(novaCijena) || 0;
Будите опрезни када користите кôд.
sacuvajIPrikazi();
};
window.obrisiJedan = function(i) {
if (confirm("Obrisati ovaj artikal?")) {
artikli.splice(i, 1);
sacuvajIPrikazi();
}
};
document.getElementById("btnObrisi").onclick = function() {
if (confirm("Da li sigurno želite obrisati SVE artikle sa telefona?")) {
artikli = [];
sacuvajIPrikazi();
}
};
document.getElementById("btnPreuzmi").onclick = function() {
if (artikli.length === 0) { alert("Lista je prazna!"); return; }
let csv = "Barkod;Naziv;Kolicina;Cijena\n" + artikli.map(a => ${a.sifra};${a.naziv || ""};${a.kolicina};${Number(a.cijena || 0).toFixed(2)}).join("\n");
let blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "inventura_2026.csv";
link.click();
};
document.getElementById("btnPodijeli").onclick = async function() {
if (artikli.length === 0) { alert("Lista je prazna!"); return; }
let tekst = artikli.map(a => ${a.sifra};${a.naziv || ""};${a.kolicina};${Number(a.cijena || 0).toFixed(2)}).join("\n");
let file = new File([tekst], "inventura.txt", { type: "text/plain" });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
try {
await navigator.share({ files: [file], title: "Inventura 2026" });
} catch (e) {}
} else {
let blob = new Blob([tekst], { type: "text/plain;charset=utf-8;" });
let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "inventura.txt";
link.click();
}
};
sacuvajIPrikazi();
