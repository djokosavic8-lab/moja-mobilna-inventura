<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 8px; cursor: pointer; }
        button:disabled { background: #999; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        button.share { background: #0078d4; margin-top: 12px; }
        button.edit { background: #ffc107; color: #000; padding: 6px 10px; font-size: 14px; width: auto; margin-top: 0; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        video { width: 100%; max-height: 260px; background: #000; border-radius: 8px; margin-top: 10px; display: none; object-fit: cover; }
        #status { padding: 10px; margin-top: 10px; border-radius: 5px; font-size: 14px; display: none; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .ukupno-box { background: #e9ecef; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 10px; text-align: right; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <h2>📦 djole nista ne radi 2026</h2>

    <div class="box">
        <h3>1. Skeniranje / Unos</h3>
        <div id="status"></div>
        <video id="video" playsinline autoplay muted></video>
        <button id="btnKamera" type="button" onclick="pokreniKameru()">📷 Upali kameru za Bar-kod</button>
        
        <p><label>Bar-kod ili Šifra:</label><input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno"></p>
        <p><label>Naziv (opciono):</label><input type="text" id="naziv" placeholder="Po potrebi upišite naziv"></p>
        <p><label>Količina:</label><input type="number" id="kolicina" value="1" min="1"></p>
        <p><label>Cijena (KM):</label><input type="number" id="cijena" step="0.01" min="0" placeholder="0.00"></p>
        <button id="btnDodaj" type="button" onclick="dodajArtikal()">➕ Upiši Artikal</button>
    </div>

    <div class="box">
        <h3>2. Zadržani artikli (<span id="ukupnoStavki">0</span>)</h3>
        <button class="share" type="button" onclick="podijeliTxt()">☁️ Pošalji na OneDrive (inventura.txt)</button>
        <button class="download" type="button" onclick="preuzmiCsv()">💾 Preuzmi lokalno na telefon (CSV)</button>
        <button class="delete" type="button" onclick="obrisiSve()">🗑️ Obriši sve sa telefona</button>
        
        <div class="ukupno-box">Ukupno: <span id="ukupnaVrijednost">0.00</span> KM</div>

        <table>
            <thead><tr><th>Šifra</th><th>Naziv</th><th>Kol.</th><th>Cijena</th><th>Akcija</th></tr></thead>
            <tbody id="tabelaArtikala"></tbody>
        </table>
    </div>

<script>
    window.onerror = function(msg, url, line) {
        alert("GREŠKA na liniji " + line + ": " + msg);
    };

    var artikli = JSON.parse(localStorage.getItem("inventura_artikli") || "[]");
    var stream = null;
    var aktivno = false;
    var pauza = false;

    function poruka(t) { 
        var s = document.getElementById("status");
        s.style.display = "block"; 
        s.innerHTML = t; 
    }

    async function pokreniKameru() {
        var btnKamera = document.getElementById("btnKamera");
        var video = document.getElementById("video");
        var statusDiv = document.getElementById("status");

        if (aktivno) { ugasiKameru(); return; }
        statusDiv.style.display = "none";

        if (!window.isSecureContext) {
            poruka("<b>BLOKIRANO:</b> Sajt mora biti otvoren preko <b>https://</b> adrese.");
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            poruka("<b>GREŠKA:</b> Pregledač ne podržava pristup kameri. Koristite Chrome.");
            return;
        }

        btnKamera.disabled = true;
        btnKamera.innerText = "⏳ Palim kameru...";

        try {
            if (stream) {
                stream.getTracks().forEach(function(t) { t.stop(); });
            }
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false
            });

            video.style.display = "block";
            video.srcObject = stream;
            await video.play();

            aktivno = true;
            btnKamera.disabled = false;
            btnKamera.innerText = "🛑 Ugasi kameru";
            btnKamera.style.background = "#6c757d";
            
            citajBarkod();
        } catch (err) {
            ugasiKameru();
            poruka("<b>GREŠKA KAMERE:</b> " + err.name + " - " + err.message);
        }
    }

    function ugasiKameru() {
        var btnKamera = document.getElementById("btnKamera");
        var video = document.getElementById("video");
        aktivno = false;
        if (stream) {
            stream.getTracks().forEach(function(t) { t.stop(); });
            stream = null;
        }
        video.srcObject = null;
        video.style.display = "none";
        btnKamera.disabled = false;
        btnKamera.innerText = "📷 Upali kameru za Bar-kod";
        btnKamera.style.background = "#007bff";
    }

    function citajBarkod() {
        if (!("BarcodeDetector" in window)) {
            poruka("Kamera radi, ali ovaj telefon/pregledač nema ugrađen čitač bar-kodova.");
            return;
        }
        var detector = new BarcodeDetector();
        var video = document.getElementById("video");

        async function petlja() {
            if (!aktivno) return;
            if (!pauza && video.readyState >= 2) {
                try {
                    var kodovi = await detector.detect(video);
                    if (kodovi && kodovi.length > 0) {
                        pauza = true;
                        var skenirano = kodovi[0].rawValue;
                        document.getElementById("sifra").value = skenirano;
                        
                        var postojeci = artikli.find(function(a) { return a.sifra === skenirano; });
                        if (postojeci) {
                            if (postojeci.naziv) document.getElementById("naziv").value = postojeci.naziv;
                            if (postojeci.cijena) document.getElementById("cijena").value = postojeci.cijena;
                        }

                        if (navigator.vibrate) navigator.vibrate(100);
                        document.getElementById("naziv").focus();
                        setTimeout(function() { pauza = false; }, 3000);
                    }
                } catch (e) {}
            }
            requestAnimationFrame(petlja);
        }
        petlja();
    }

    function dodajArtikal() {
        var sifra = document.getElementById("sifra").value.trim();
        var naziv = document.getElementById("naziv").value.trim().replace(/,/g, " ").replace(/;/g, " ");
        var kol = parseInt(document.getElementById("kolicina").value);
        var cijenaUnos = document.getElementById("cijena").value.replace(",", ".");
        var cijena = parseFloat(cijenaUnos) || 0;

        if (!sifra) { alert("Upišite ili skenirajte šifru!"); return; }
        if (isNaN(kol) || kol < 1) { alert("Količina mora biti najmanje 1!"); return; }
        
        var p = artikli.find(function(a) { return a.sifra === sifra; });
        if (p) {
            p.kolicina += kol;
            if (naziv) p.naziv = naziv;
            if (cijenaUnos !== "") p.cijena = cijena;
        } else {
            artikli.push({ sifra: sifra, naziv: naziv, kolicina: kol, cijena: cijena });
        }
        
        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikazi();
        
        document.getElementById("sifra").value = "";
        document.getElementById("naziv").value = "";
        document.getElementById("kolicina").value = "1";
        document.getElementById("cijena").value = "";
        pauza = false;
    }

    function izmjeni(s) {
        var a = artikli.find(function(x) { return x.sifra === s; });
        if (!a) return;
        
        var noviNaziv = prompt("Naziv za " + s + ":", a.naziv || "");
        if (noviNaziv === null) return;
        a.naziv = noviNaziv.trim().replace(/,/g, " ").replace(/;/g, " ");

        var n = prompt("Nova količina za " + s + " (0 za brisanje):", a.kolicina);
        if (n === null) return;
        var b = parseInt(n);
        if (isNaN(b) || b < 0) return;
        
        if (b === 0) {
            artikli = artikli.filter(function(x) { return x.sifra !== s; });
        } else {
            a.kolicina = b;
            var novaCijena = prompt("Nova cijena za " + s + ":", a.cijena || 0);
            if (novaCijena !== null) {
                var c = parseFloat(novaCijena.replace(",", "."));
                if (!isNaN(c) && c >= 0) a.cijena = c;
            }
        }
        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikazi();
    }

    function prikazi() {
        var tb = document.getElementById("tabelaArtikala");
        tb.innerHTML = "";
        var ukupno = 0;

        for (var i = 0; i < artikli.length; i++) {
            var a = artikli[i];
            var c = parseFloat(a.cijena) || 0;
            ukupno += a.kolicina * c;

tb.innerHTML += "" +
"" + a.sifra + "" +
"" + (a.naziv || "-") + "" +
"" + a.kolicina + "" +
"" + c.toFixed(2) + "" +
"<button class='edit' type='button' onclick="izmjeni('" + a.sifra + "')">✏️" +
"";
}
document.getElementById("ukupnoStavki").innerText = artikli.length;
document.getElementById("ukupnaVrijednost").innerText = ukupno.toFixed(2);
}
function preuzmiCsv() {
if (artikli.length === 0) { alert("Lista je prazna!"); return; }
var redovi = ["Sifra,Naziv,Kolicina,Cijena,Ukupno"];
for (var i = 0; i < artikli.length; i++) {
var a = artikli[i];
var c = parseFloat(a.cijena) || 0;
redovi.push(a.sifra + "," + (a.naziv || "") + "," + a.kolicina + "," + c.toFixed(2) + "," + (a.kolicina * c).toFixed(2));
}
var blob = new Blob([redovi.join("\n")], { type: "text/csv;charset=utf-8;" });
var link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "inventura.csv";
link.click();
}
async function podijeliTxt() {
if (artikli.length === 0) { alert("Lista je prazna!"); return; }
var redovi = [];
for (var i = 0; i < artikli.length; i++) {
var a = artikli[i];
var c = parseFloat(a.cijena) || 0;
redovi.push(a.sifra + ";" + (a.naziv || "") + ";" + a.kolicina + ";" + c.toFixed(2));
}
var file = new File([redovi.join("\r\n")], "inventura.txt", { type: "text/plain" });
if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: "Inventura 2026" });
} else {
alert("Pregledač ne podržava direktno slanje. Koristite dugme za preuzimanje CSV.");
}
}
function obrisiSve() {
if (confirm("Obrisati sve artikle?")) {
artikli = [];
localStorage.removeItem("inventura_artikli");
prikazi();
}
}
prikazi();
